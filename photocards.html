<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Photo Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Photo Cards Gallery</h1>
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+1" alt="Placeholder Image 1">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+2" alt="Placeholder Image 2">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+3" alt="Placeholder Image 3">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+4" alt="Placeholder Image 4">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+5" alt="Placeholder Image 5">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+6" alt="Placeholder Image 6">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+7" alt="Placeholder Image 7">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+8" alt="Placeholder Image 8">
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300x250?text=Photo+9" alt="Placeholder Image 9">
            </div>
        </div>
    </div>
</body>
</html>
