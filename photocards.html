<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Photo Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .card-title {
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Photo Cards Gallery</h1>
        <div class="grid">
            <div class="card">
                <img src="https://cdn.britannica.com/82/232782-050-8062ACFA/Black-labrador-retriever-dog.jpg" alt="Black Labrador Retriever">
                <p class="card-title">Labrador retriever</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-2/600/500" alt="Gallery photo 2">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-3/600/500" alt="Gallery photo 3">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-4/600/500" alt="Gallery photo 4">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-5/600/500" alt="Gallery photo 5">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-6/600/500" alt="Gallery photo 6">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-7/600/500" alt="Gallery photo 7">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-8/600/500" alt="Gallery photo 8">
            </div>
            <div class="card">
                <img src="https://picsum.photos/seed/photo-9/600/500" alt="Gallery photo 9">
            </div>
        </div>
    </div>
</body>
</html>
